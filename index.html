<!doctype html><html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boat Life Simulator v0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522;font-family:Arial,sans-serif;touch-action:none}#g{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3;pointer-events:none}.c{background:#102433cc;border:1px solid #ffffff33;border-radius:15px;color:white;padding:8px 12px;text-align:center;min-width:85px;backdrop-filter:blur(8px)}.c b{display:block;font-size:18px}.c small{opacity:.7}
#mission{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:3;background:#102433cc;color:#fff;border:1px solid #fff3;border-radius:14px;padding:10px 16px;max-width:85%;text-align:center}
#joy{position:fixed;left:24px;bottom:35px;width:135px;height:135px;border-radius:50%;background:#07131f66;border:1px solid #fff4;z-index:4}#stick{position:absolute;width:52px;height:52px;border-radius:50%;background:#e9eef0d9;left:41px;top:41px}
.btn{position:fixed;right:20px;width:135px;height:58px;border:0;border-radius:17px;color:white;font-weight:bold;font-size:14px;z-index:4}.up{bottom:105px;background:#23834fd9}.down{bottom:35px;background:#a53d39d9}
#start{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#28657e,#030a11 75%);z-index:9;display:grid;place-items:center;color:#fff;text-align:center}.box{width:85%;max-width:420px;background:#071522dd;border:1px solid #fff3;border-radius:25px;padding:28px;backdrop-filter:blur(12px)}.box h1{font-size:30px;margin:0 0 8px}.box p{opacity:.75;line-height:1.5}.box button{padding:15px 30px;border:0;border-radius:15px;font-size:17px;font-weight:bold}
</style></head><body><div id="g"></div>
<div id="hud"><div class="c"><b id="fuel">77 L</b><small>ΚΑΥΣΙΜΟ</small></div><div class="c"><b id="money">€4.500</b><small>ΧΡΗΜΑΤΑ</small></div><div class="c"><b id="spd">0 kn</b><small>ΤΑΧΥΤΗΤΑ</small></div></div>
<div id="mission">Αποστολή: πήγαινε στο πράσινο σημείο του λιμανιού</div>
<div id="joy"><div id="stick"></div></div><button class="btn up" id="gas">THROTTLE ▲</button><button class="btn down" id="br">BRAKE / REVERSE ▼</button>
<div id="start"><div class="box"><h1>Boat Life Simulator</h1><p>3D mobile prototype v0.2<br>Νέο cockpit, καλύτερη θάλασσα, φωτισμός, νησί και λιμάνι.</p><button id="go">ΕΝΑΡΞΗ</button></div></div>
<script type="module">
import*as T from'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const S=new T.Scene();S.fog=new T.FogExp2(0x8ebdce,.0018);
const C=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1800);
const R=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.8));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.2;R.outputColorSpace=T.SRGBColorSpace;g.append(R.domElement);
S.add(new T.HemisphereLight(0xc7edff,0x263c46,1.8));let sun=new T.DirectionalLight(0xffe1b0,3);sun.position.set(-180,300,180);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);S.add(sun);
const sg=new T.SphereGeometry(950,32,16),sm=new T.ShaderMaterial({side:T.BackSide,uniforms:{a:{value:new T.Color(0x4e8daf)},b:{value:new T.Color(0xdceef5)}},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;uniform vec3 a,b;void main(){float h=normalize(p).y*.5+.5;gl_FragColor=vec4(mix(b,a,pow(h,.75)),1.);}'});S.add(new T.Mesh(sg,sm));
const wg=new T.PlaneGeometry(1800,1800,160,160);wg.rotateX(-Math.PI/2);
const wm=new T.ShaderMaterial({uniforms:{t:{value:0}},vertexShader:'uniform float t;varying vec3 w;void main(){vec3 p=position;p.y+=sin(p.x*.035+t*1.4)*.5+cos(p.z*.045+t)*.4+sin((p.x+p.z)*.018-t)*.6;w=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);}',fragmentShader:'varying vec3 w;uniform float t;void main(){vec3 d=vec3(.015,.18,.27),n=vec3(.04,.4,.52);float f=clamp(length(w.xz)/900.,0.,1.);float s=pow(max(0.,sin(w.x*.2+t*3.)*sin(w.z*.16-t*2.)),18.)*.12;gl_FragColor=vec4(mix(n,d,f)+s,1.);}'});let water=new T.Mesh(wg,wm);S.add(water);
const M=c=>(new T.MeshStandardMaterial({color:c,roughness:.55})),B=(x,y,z,c)=>{let m=new T.Mesh(new T.BoxGeometry(x,y,z),M(c));m.castShadow=m.receiveShadow=true;return m},Y=(r,h,c)=>new T.Mesh(new T.CylinderGeometry(r,r,h,20),M(c));
function island(x,z,s){let q=new T.Group();q.position.set(x,0,z);let h=new T.Mesh(new T.ConeGeometry(55*s,65*s,32),M(0x607865));h.position.y=34*s;h.scale.z=.7;q.add(h);for(let i=0;i<9;i++){let b=B((5+Math.random()*6)*s,(5+Math.random()*8)*s,(5+Math.random()*6)*s,0xe9dfcf);b.position.set((-28+Math.random()*56)*s,7*s+b.geometry.parameters.height/2,(8+Math.random()*30)*s);q.add(b)}for(let i=0;i<12;i++){let tr=Y(2.5*s,7*s,0x356b46);let a=i*.9,r=(20+Math.random()*30)*s;tr.position.set(Math.cos(a)*r,9*s,Math.sin(a)*r*.6);q.add(tr)}S.add(q)}island(-30,-210,1.15);island(180,-350,.9);
let dock=B(110,2.5,12,0x665a4c);dock.position.set(0,1,-70);S.add(dock);
function lighthouse(){let q=new T.Group();q.position.set(-80,0,-115);let b=Y(7,30,0xe9e5d9);b.position.y=15;q.add(b);let l=Y(4.5,4,0xffd978);l.position.y=34;l.material.emissive=new T.Color(0xffa52f);l.material.emissiveIntensity=2.5;q.add(l);let r=Y(5,4,0x263945);r.position.y=38;q.add(r);S.add(q)}lighthouse();
function boat(){let q=new T.Group();let h=new T.Mesh(new T.CapsuleGeometry(2.3,7,8,24),M(0x1d2930));h.rotation.z=Math.PI/2;h.scale.y=.45;h.position.y=.8;q.add(h);for(let x of[-1.7,1.7]){let t=new T.Mesh(new T.CapsuleGeometry(.58,6.6,8,20),M(0x11191d));t.rotation.z=Math.PI/2;t.scale.y=.7;t.position.set(x,.9,0);q.add(t)}let d=B(3,.25,5.5,0xbfc2bd);d.position.y=1.45;q.add(d);let co=B(1.6,1.4,1,0x182328);co.position.set(0,2.1,.2);q.add(co);let wi=new T.Mesh(new T.BoxGeometry(1.65,.85,.06),new T.MeshPhysicalMaterial({color:0x8ec9df,transparent:true,opacity:.32,roughness:.08}));wi.position.set(0,2.85,-.15);wi.rotation.x=-.22;q.add(wi);let wh=new T.Mesh(new T.TorusGeometry(.38,.07,12,32),M(0x101820));wh.position.set(0,2.35,.82);wh.rotation.x=Math.PI/2;q.add(wh);let se=B(1.5,.25,1.5,0x293338);se.position.set(0,2.05,1.6);q.add(se);let sb=B(1.5,1,.2,0x293338);sb.position.set(0,2.45,2.2);q.add(sb);q.position.set(0,.25,35);S.add(q);return q}let boatObj=boat();
let v=0,st=0,gas=0,rev=0,fuelV=77,moneyV=4500,done=false,started=false,target=new T.Vector3(0,0,-63);
let mark=new T.Mesh(new T.RingGeometry(3,4,32),new T.MeshBasicMaterial({color:0x48ff83,side:T.DoubleSide}));mark.rotation.x=-Math.PI/2;mark.position.set(0,.2,-63);S.add(mark);
function joyCtl(){let j=document.getElementById('joy'),k=document.getElementById('stick'),on=0; j.onpointerdown=j.onpointermove=e=>{on=1;let r=j.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=42;if(l>m){dx*=m/l;dy*=m/l}k.style.transform=`translate(${dx}px,${dy}px)`;st=Math.max(-1,Math.min(1,dx/m))};j.onpointerup=j.onpointercancel=()=>{on=0;st=0;k.style.transform='translate(0,0)'}}joyCtl();
function hold(e,set){e.onpointerdown=()=>set(1);e.onpointerup=e.onpointercancel=e.onpointerleave=()=>set(0)}hold(gas,x=>gas=x);hold(br,x=>rev=x);
go.onclick=()=>{started=true;start.style.display='none'};
let clock=new T.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);wm.uniforms.t.value+=dt;mark.rotation.z+=dt*.7;
if(started){v+=(gas?5.5:0)+(rev?-5.5:-1.1);v=Math.max(-3.5,Math.min(13,v));boatObj.rotation.y-=st*v*.012;let f=new T.Vector3(0,0,-1).applyQuaternion(boatObj.quaternion);boatObj.position.addScaledVector(f,v*dt);boatObj.position.y=.25+Math.sin(performance.now()*.002)*.12;fuelV-=Math.abs(v)*dt*.018;
if(!done&&boatObj.position.distanceTo(target)<11){done=true;moneyV+=500;mission.textContent='Αποστολή ολοκληρώθηκε — +€500';mark.visible=false}
let cp=new T.Vector3(0,3.15,3.05).applyQuaternion(boatObj.quaternion).add(boatObj.position);C.position.lerp(cp,.12);let lk=new T.Vector3(0,2.45,-15).applyQuaternion(boatObj.quaternion).add(boatObj.position);C.lookAt(lk)}
fuel.textContent=Math.max(0,fuelV).toFixed(0)+' L';money.textContent='€'+moneyV.toLocaleString('el-GR');spd.textContent=Math.max(0,v*1.94).toFixed(0)+' kn';R.render(S,C)}loop();
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
